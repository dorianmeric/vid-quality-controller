[package]
name = "vid-quality-controller"
version = "1.0.0"
edition = "2024"
description = "TUI to find over-bitrated videos and re-encode them in place with AV1"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
