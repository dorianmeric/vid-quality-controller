name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: vid-quality-controller

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 + x32
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows-x86
          # macOS (Apple Silicon + Intel)
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          # Linux (Debian, Ubuntu, Arch Linux share the same glibc binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test (linux-x64 only)
        if: matrix.platform == 'linux-x64'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="${BIN_NAME}-${VERSION}-${{ matrix.platform }}"
          mkdir -p out "stage/${NAME}"

          if [ -f "target/${TARGET}/release/${BIN_NAME}.exe" ]; then
            cp "target/${TARGET}/release/${BIN_NAME}.exe" "stage/${NAME}/"
          else
            cp "target/${TARGET}/release/${BIN_NAME}" "stage/${NAME}/"
          fi
          cp README.md "stage/${NAME}/"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            7z a -tzip "out/${NAME}.zip" "./stage/${NAME}" > /dev/null
          else
            tar -C stage -czf "out/${NAME}.tar.gz" "${NAME}"
          fi
          ls -l out

      # ---------- Linux: .deb for Debian/Ubuntu, .pkg.tar.zst for Arch ----------
      - name: Package .deb (Debian/Ubuntu)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          ROOT="pkg/deb"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/doc/${BIN_NAME}"
          install -m 755 "target/${{ matrix.target }}/release/${BIN_NAME}" "$ROOT/usr/bin/${BIN_NAME}"
          cp README.md "$ROOT/usr/share/doc/${BIN_NAME}/"

          SIZE_KB=$(du -sk "$ROOT" | cut -f1)
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: ${BIN_NAME}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE_KB}
          Depends: ffmpeg
          Maintainer: dorianmeric <d.meric@gmail.com>
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: TUI that finds over-bitrated videos and re-encodes them in place
           Scans a folder for videos whose bitrate is far above what their content needs,
           then re-encodes them to AV1 (SVT) in place, keeping the result only when it is
           verified to be the same length and smaller. Requires ffmpeg for encoding.
          EOF

          chmod 755 "$ROOT/DEBIAN"
          dpkg-deb --build --root-owner-group "$ROOT" \
            "out/${BIN_NAME}_${VERSION}_amd64.deb"

      - name: Package .pkg.tar.zst (Arch Linux)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          ROOT="pkg/arch"
          mkdir -p "$ROOT/usr/bin" "$ROOT/usr/share/doc/${BIN_NAME}"
          install -m 755 "target/${{ matrix.target }}/release/${BIN_NAME}" "$ROOT/usr/bin/${BIN_NAME}"
          cp README.md "$ROOT/usr/share/doc/${BIN_NAME}/"

          SIZE=$(du -sb "$ROOT" | cut -f1)
          cat > "$ROOT/.PKGINFO" <<EOF
          # Generated by the vid-quality-controller release workflow
          pkgname = ${BIN_NAME}
          pkgver = ${VERSION}-1
          pkgdesc = TUI that finds over-bitrated videos and re-encodes them in place with AV1
          url = https://github.com/${GITHUB_REPOSITORY}
          builddate = $(date +%s)
          packager = dorianmeric <d.meric@gmail.com>
          size = ${SIZE}
          arch = x86_64
          depend = ffmpeg
          EOF

          command -v zstd > /dev/null || sudo apt-get install -y zstd
          ( cd "$ROOT" && tar --owner=0 --group=0 -cf - . | zstd -q -19 -o \
              "../out/${BIN_NAME}-${VERSION}-1-x86_64.pkg.tar.zst" )
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
